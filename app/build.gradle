plugins {
    id 'com.android.application'
}

android {
    namespace 'es.jaumesingla.StackCalculator'
    compileSdk 37

    defaultConfig {
        applicationId "es.jaumesingla.StackCalculator"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
